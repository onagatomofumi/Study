<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org">
<body>
  <div class="container">
    <div th:if="${validationError}" th:each="error : ${validationError}">
      <label class="text-danger" th:text="${error}"></label>
    </div>
    <h1>新規登録</h1>
    <form th:action="@{/task/create}" th:object="${taskRequest}" th:method="post">

      <div class="form-group">
        <label>タスク：<span class="text-danger">※</span></label>
        <input type="text" th:field="*{name}" class="form-control">
      </div>

      <div class="form-group">
        <label>ステータス：<span class="text-danger">※</span></label>
        <input type="text" th:field="*{status}" class="form-control">
      </div>
      <br />
      <div class="text-center">
        <a href="/task/list" class="btn btn-secondary">キャンセル</a>
        <input type="submit" value="　登録　" class="btn btn-primary">
      </div>
    </form>
  </div>
</body>
</html>
