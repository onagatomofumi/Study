<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org">
<body>
  <div class="container">
    <h1>情報詳細</h1>
    <div th:object="${taskData}">
      <div class="row mx-md-n5">
        <div class="col-2 pt-3 border bg-light">タスク</div>
        <div class="col pt-3 border">
          <p th:text="*{name}"></p>
        </div>
      </div>
      <div class="row mx-md-n5">
        <div class="col-2 pt-3 border bg-light">ステータス</div>
        <div class="col pt-3 border">
          <p th:text="*{status}"></p>
        </div>
      </div>
    </div>
    <br />
    <div class="text-center">
      <a th:href="@{/task/{id}/edit(id=*{id})}" class="btn btn-primary" >　編集　</a>
      <a th:href="@{/task/{id}/delete(id=*{id})}" class="btn btn-secondary">　削除　</a>
      <a href="/task/list" class="btn btn-secondary">一覧に戻る</a>
    </div>
  </div>
</body>
</html>
